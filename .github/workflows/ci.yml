name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test tooling
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Syntax check
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/Agent365-Bulk-Actions.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: Lint
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./Agent365-Bulk-Actions.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap
          if ($findings) { exit 1 }

      - name: Tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $result = Invoke-Pester -Path ./tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
